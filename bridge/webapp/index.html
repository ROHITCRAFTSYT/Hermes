<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hermes</title>
<style>
  :root{
    --bg:#0d1012; --surface:#161a1d; --surface-2:#1c2225; --line:#262d31;
    --ink:#eceff0; --muted:#9aa4ac; --accent:#ff8a41; --accent-soft:#3a2417;
    --teal:#2cc4c4; --good:#3ec06a; --bad:#e0574f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft)}
  .brand small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
  .iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer}
  #status{font-size:.72rem;color:var(--muted);padding:6px 18px;border-bottom:1px solid var(--line)}
  #status b{color:var(--good)}
  #status.bad b{color:var(--bad)}

  main{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:.98rem;line-height:1.45;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--accent);color:#1a0e05;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.8rem;text-align:center}
  .hint{color:var(--muted);font-size:.82rem;text-align:center;margin:auto 0}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 18px;border-top:1px solid var(--line)}
  .chip{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    padding:8px 12px;border-radius:100px;font-size:.82rem;cursor:pointer;white-space:nowrap}
  .chip:active{background:var(--accent);color:#1a0e05}

  footer{display:flex;align-items:center;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    border-top:1px solid var(--line);background:var(--surface)}
  #text{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px 14px;font-size:1rem;outline:none}
  #text:focus{border-color:var(--accent)}
  .mic{width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);color:#1a0e05;font-size:1.4rem;display:grid;place-items:center;transition:transform .1s}
  .mic:active{transform:scale(.94)}
  .mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
  .mic:disabled{opacity:.4}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,87,79,.5)}50%{box-shadow:0 0 0 12px rgba(224,87,79,0)}}
  .send{width:52px;height:52px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-size:1.2rem;cursor:pointer}

  dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:340px;width:90%}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 4px}
  dialog p{margin:0 0 14px;color:var(--muted);font-size:.86rem}
  dialog input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:.95rem;margin-bottom:14px}
  dialog button{width:100%;background:var(--accent);color:#1a0e05;border:none;border-radius:10px;
    padding:12px;font-size:1rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span><div>Hermes<small>home agent</small></div></div>
    <button class="iconbtn" id="gear" title="Settings">⚙</button>
  </header>
  <div id="status">connecting…</div>

  <main id="log">
    <div class="hint">Tap the mic and speak, or type a command below.<br>Try “what can you do?”</div>
  </main>

  <div class="chips" id="chips">
    <button class="chip">What can you do?</button>
    <button class="chip">Turn on the lights</button>
    <button class="chip">Turn off the lights</button>
    <button class="chip">Play music</button>
    <button class="chip">Pause</button>
    <button class="chip">What's the weather?</button>
    <button class="chip">Lock the PC</button>
  </div>

  <footer>
    <button class="mic" id="mic" title="Hold-free: tap to talk">🎙</button>
    <input id="text" placeholder="Type a command…" autocomplete="off">
    <button class="send" id="send">➤</button>
  </footer>

  <dialog id="cfg">
    <h3>Connect</h3>
    <p>Paste the access token from your <code>.env</code> file (HERMES_TOKEN).</p>
    <input id="tok" placeholder="access token" autocomplete="off">
    <button id="save">Save &amp; connect</button>
  </dialog>

<script>
const API = location.origin;                 // app is served by the bridge, same origin
let TOKEN = localStorage.getItem("hermes_token") || "";
const log = document.getElementById("log");
const statusEl = document.getElementById("status");
const cfg = document.getElementById("cfg");

function headers(extra={}){ return TOKEN ? {"X-Hermes-Token":TOKEN, ...extra} : extra; }

function add(text, who){
  document.querySelector(".hint")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

async function health(){
  try{
    const r = await fetch(API + "/health");
    const j = await r.json();
    if(!j.brain){ statusEl.className="bad"; statusEl.innerHTML="online, but <b>no Groq key</b> — add it to .env"; }
    else{ statusEl.className=""; statusEl.innerHTML="<b>ready</b> · "+j.llm+(j.auth?" · 🔒":""); }
  }catch(e){ statusEl.className="bad"; statusEl.innerHTML="<b>can't reach brain</b> — is the bridge running?"; }
}

async function sendText(text){
  if(!text) return;
  add(text,"me");
  const t = add("…","bot");
  try{
    const r = await fetch(API+"/chat",{method:"POST",headers:headers({"Content-Type":"application/json"}),
      body:JSON.stringify({text})});
    if(r.status===401){ t.remove(); openCfg("Wrong or missing token."); return; }
    const j = await readJson(r);
    t.textContent = j.reply || j.detail || "No reply.";
  }catch(e){ t.textContent = "Couldn't reach the brain: " + e.message; }
}
async function readJson(r){
  const text = await r.text();
  let j = {};
  try{ j = text ? JSON.parse(text) : {}; }
  catch(e){ throw new Error(text || ("HTTP " + r.status)); }
  if(!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
  return j;
}

// ── voice ──
let mediaRec=null, chunks=[], recording=false;
const mic = document.getElementById("mic");
const secure = window.isSecureContext || location.hostname==="localhost";
if(!secure){ mic.disabled=true; mic.title="Voice needs HTTPS (use the tunnel). Text works everywhere."; }

mic.onclick = async ()=>{
  if(!secure) return;
  if(recording){ mediaRec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec = new MediaRecorder(stream);
    chunks=[];
    mediaRec.ondataavailable = e=>chunks.push(e.data);
    mediaRec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      recording=false; mic.classList.remove("rec"); mic.textContent="🎙";
      const blob = new Blob(chunks,{type: mediaRec.mimeType||"audio/webm"});
      const me = add("🎤 …","me"); const bot = add("…","bot");
      try{
        const r = await fetch(API+"/talk",{method:"POST",
          headers:headers({"Content-Type":blob.type}), body:blob});
        if(r.status===401){ me.remove(); bot.remove(); openCfg("Wrong or missing token."); return; }
        const j = await readJson(r);
        me.textContent = j.heard || "🎤 (couldn't hear)";
        bot.textContent = j.reply;
        if(j.audio_b64) playB64(j.audio_b64);
      }catch(e){ bot.textContent="Voice failed: " + e.message; }
    };
    mediaRec.start(); recording=true; mic.classList.add("rec"); mic.textContent="■";
  }catch(e){ add("Mic permission denied.","sys"); }
};

function playB64(b64){
  const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes],{type:"audio/wav"}));
  new Audio(url).play().catch(()=>{});
}

// ── wiring ──
document.getElementById("send").onclick = ()=>{ const t=document.getElementById("text"); sendText(t.value.trim()); t.value=""; };
document.getElementById("text").addEventListener("keydown",e=>{ if(e.key==="Enter"){ document.getElementById("send").click(); }});
document.getElementById("chips").addEventListener("click",e=>{ if(e.target.classList.contains("chip")) sendText(e.target.textContent); });
document.getElementById("gear").onclick = ()=>openCfg();
function openCfg(msg){ if(msg) cfg.querySelector("p").textContent=msg; document.getElementById("tok").value=TOKEN; cfg.showModal(); }
document.getElementById("save").onclick = ()=>{ TOKEN=document.getElementById("tok").value.trim();
  localStorage.setItem("hermes_token",TOKEN); cfg.close(); health(); };

health();
if(!TOKEN) setTimeout(()=>{ fetch(API+"/health").then(r=>r.json()).then(j=>{ if(j.auth) openCfg(); }); }, 300);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
